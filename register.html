<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Register - WeOneFX</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>

<nav>

<h2>WeOneFX</h2>

</nav>


<section class="hero">

<h1>Create Account</h1>


<input
    type="text"
    id="fullname"
    placeholder="Full Name"
    autocomplete="name"
>


<br><br>


<input
    type="email"
    id="email"
    placeholder="Email Address"
    autocomplete="email"
>


<br><br>


<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="new-password"
>


<br><br>


<button
    id="registerButton"
    type="button"
>
    Create Account
</button>


<br><br>


<p>

Already have an account?

<a href="login.html">
Login
</a>

</p>


</section>


<script src="register.js"></script>

</body>

</html>
