<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - WeOneFX</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

    <h2>WeOneFX</h2>

</nav>


<section class="hero">

    <h1>Login</h1>


    <input
        type="email"
        id="email"
        placeholder="Email"
        autocomplete="email"
        required
    >


    <br><br>


    <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
    >


    <br><br>


    <button
        type="button"
        id="loginButton"
    >
        Login
    </button>


    <p id="loginMessage"></p>


    <p>

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </p>

</section>


<!-- Login JavaScript -->
<script src="login.js" defer></script>


</body>

</html>
