<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Withdraw - WeOneFX</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    background: #111827;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.hero {
    text-align: center;
    margin-top: 60px;
}

input {
    width: 320px;
    padding: 12px;
    margin: 10px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

button {
    padding: 12px 25px;
    background: #f4c542;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: gold;
}

#message {
    margin-top: 20px;
    color: #00ff99;
}

</style>

</head>


<body>


<nav>

    <h2>WeOneFX</h2>

    <div>

        <a href="dashboard.html">Dashboard</a>

        <a href="deposit.html">Deposit</a>

        <a href="withdraw.html">Withdraw</a>

        <a href="trade.html">Trade</a>

        <a href="history.html">History</a>

        <a href="profile.html">Profile</a>

        <a href="login.html">Logout</a>

    </div>

</nav>


<section class="hero">


    <h1>Withdraw Funds</h1>


    <h3>
        Current Balance:
        KES
        <span id="balance">0.00</span>
    </h3>


    <input
        type="text"
        id="phone"
        placeholder="2547XXXXXXXX"
    >


    <br>


    <input
        type="number"
        id="amount"
        placeholder="KES 2,000 - 100,000"
    >


    <br>


    <button id="withdrawButton">
        Submit Withdrawal Request
    </button>


    <p id="message"></p>


    <br>


    <a href="dashboard.html">
        <button type="button">
            Back to Dashboard
        </button>
    </a>


</section>


<!-- Existing application JavaScript -->

<script src="app.js"></script>

<!-- Withdrawal JavaScript -->

<script src="withdraw.js"></script>


</body>

</html>
