<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deposit - WeOneFX</title>

<link rel="stylesheet" href="style.css">

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

nav{
    background:#0f172a;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:15px;
}

.hero{
    width:450px;
    max-width:90%;
    margin:50px auto;
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#f4c542;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:gold;
}

.walletBox{
    background:#1f2937;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
    word-break:break-all;
}

#message{
    color:#00ff99;
    white-space:pre-wrap;
    margin-top:15px;
}

</style>

</head>

<body>

<nav>

<h2>WeOneFX</h2>

<div>

<a href="dashboard.html">Dashboard</a>
<a href="deposit.html">Deposit</a>
<a href="withdraw.html">Withdraw</a>
<a href="trade.html">Trade</a>
<a href="history.html">History</a>
<a href="profile.html">Profile</a>
<a href="login.html">Logout</a>

</div>

</nav>

<section class="hero">

<h1>Deposit Funds</h1>

<h3>
Balance: KES <span id="balance">0.00</span>
</h3>
<input
type="text"
id="phone"
placeholder="2547XXXXXXXX">

<input
type="number"
id="amount"
placeholder="KES 500 - 250,000">

<button onclick="requestDeposit()">
💳 Deposit via Pesapal
</button>

<p id="message"></p>

<hr style="margin:35px 0;">

<h2>Deposit with USDT (BEP20)</h2>

<p>
Send your USDT using the <b>BNB Smart Chain (BEP20)</b> network only.
</p>

<div class="walletBox">

<h3>Wallet Address</h3>

<input
type="text"
id="walletAddress"
value="0x1a81d4765c26f932726d345dbe0cf08d000cb628"
readonly>

<button onclick="copyWallet()">
📋 Copy Wallet Address
</button>

<p>

<b>Network:</b> BEP20 (BNB Smart Chain)

<br><br>

<b>Minimum Crypto Deposit:</b> 10 USDT

</p>

</div>

<br>

<input
type="text"
id="txid"
placeholder="Paste Transaction Hash (TXID)">

<button onclick="submitCryptoDeposit()">
✅ I Have Paid
</button>

<p id="cryptoMessage"></p>

<script src="app.js"></script>

<script>

showBalance("balance");
async function requestDeposit(){

    const phone = document.getElementById("phone").value.trim();
    const amount = parseFloat(document.getElementById("amount").value);
    const message = document.getElementById("message");

    if(phone===""){
        message.innerHTML="Please enter your phone number.";
        return;
    }

    if(isNaN(amount)){
        message.innerHTML="Please enter a valid amount.";
        return;
    }

    if(amount<500){
        message.innerHTML="Minimum deposit is KES 500.";
        return;
    }

    if(amount>250000){
        message.innerHTML="Maximum deposit is KES 250,000.";
        return;
    }

    const currentUser = getLoggedUser();

    if(!currentUser){
        alert("Please login first.");
        window.location.href="login.html";
        return;
    }

    message.innerHTML="Creating payment...";

    try{

        const response = await fetch("http://localhost:3000/api/pay",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                amount:amount,
                currency:"KES",
                name:currentUser.fullname || currentUser.fullName,
                email:currentUser.email,
                phone:phone

            })

        });

        const data = await response.json();

        if(data.redirect_url){
            window.location.href=data.redirect_url;
            return;
        }

        if(data.redirectUrl){
            window.location.href=data.redirectUrl;
            return;
        }

        message.innerHTML=JSON.stringify(data,null,2);

    }catch(err){

        console.log(err);

        message.innerHTML="Unable to connect to payment server.";

    }

}

function copyWallet(){

    const wallet=document.getElementById("walletAddress");

    wallet.select();
    wallet.setSelectionRange(0,99999);

    navigator.clipboard.writeText(wallet.value);

    document.getElementById("cryptoMessage").innerHTML=
    "✅ Wallet address copied.";

}

function submitCryptoDeposit(){

    const txid=document.getElementById("txid").value.trim();

    if(txid===""){

        alert("Please paste your Transaction Hash (TXID).");

        return;

    }

    localStorage.setItem("cryptoDeposit",JSON.stringify({

        wallet:"0x1a81d4765c26f932726d345dbe0cf08d000cb628",

        txid:txid,

        status:"Pending Verification",

        date:new Date().toLocaleString()

    }));

    document.getElementById("cryptoMessage").innerHTML=
    "✅ Your crypto deposit request has been submitted and is awaiting verification.";

}
</script>

<br><br>

<a href="dashboard.html">
    <button>
        Back to Dashboard
    </button>
</a>

</section>

</body>

</html>
