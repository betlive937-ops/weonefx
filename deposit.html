<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Deposit - WeOneFX</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    background: #111827;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

nav {
    background: #0f172a;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav h2 {
    margin: 0;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
}

.hero {
    width: 450px;
    max-width: 90%;
    margin: 50px auto;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #f4c542;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: gold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.walletBox {
    background: #1f2937;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

#message,
#cryptoMessage {
    color: #00ff99;
    margin-top: 15px;
    white-space: pre-wrap;
}

hr {
    margin: 35px 0;
}

</style>

</head>


<body>


<nav>

    <h2>WeOneFX</h2>

    <div>

        <a href="dashboard.html">Dashboard</a>

        <a href="deposit.html">Deposit</a>

        <a href="withdraw.html">Withdraw</a>

        <a href="trade.html">Trade</a>

        <a href="history.html">History</a>

        <a href="profile.html">Profile</a>

        <a href="login.html">Logout</a>

    </div>

</nav>


<section class="hero">


    <h1>Deposit Funds</h1>


    <h3>
        Balance: KES
        <span id="balance">0.00</span>
    </h3>


    <!-- =============================== -->
    <!-- PESAPAL DEPOSIT -->
    <!-- =============================== -->

    <input
        type="text"
        id="phone"
        placeholder="2547XXXXXXXX"
        autocomplete="tel"
    >


    <input
        type="number"
        id="amount"
        placeholder="KES 500 - 250000"
        min="500"
        max="250000"
    >


    <button
        type="button"
        id="pesapalButton"
    >
        💳 Deposit via Pesapal
    </button>


    <p id="message"></p>


    <hr>


    <!-- =============================== -->
    <!-- BEP20 DEPOSIT -->
    <!-- =============================== -->

    <h2>Deposit with USDT (BEP20)</h2>


    <p>
        Send your USDT using the
        <b>BNB Smart Chain (BEP20)</b>
        network only.
    </p>


    <div class="walletBox">


        <h3>Wallet Address</h3>


        <input
            type="text"
            id="walletAddress"
            value="0x1a81d4765c26f932726d345dbe0cf08d000cb628"
            readonly
        >


        <button
            type="button"
            id="copyWalletButton"
        >
            📋 Copy Wallet Address
        </button>


        <p>

            <b>Network:</b>
            BEP20 (BNB Smart Chain)

            <br><br>

            <b>Minimum Crypto Deposit:</b>
            10 USDT

        </p>


    </div>


    <br>


    <input
        type="text"
        id="txid"
        placeholder="Paste Transaction Hash (TXID)"
    >


    <button
        type="button"
        id="cryptoDepositButton"
    >
        ✅ I Have Paid
    </button>


    <p id="cryptoMessage"></p>


    <br><br>


    <a href="dashboard.html">

        <button type="button">
            ⬅️ Back to Dashboard
        </button>

    </a>


</section>


<!-- Existing shared JavaScript -->

<script src="app.js"></script>

<!-- Deposit-specific JavaScript -->

<script src="deposit.js"></script>


</body>

</html>
