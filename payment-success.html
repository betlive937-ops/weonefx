<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Verification - WeOneFX</title>

<style>

body {
    background: #111827;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    padding-top: 80px;
}

.container {
    width: 500px;
    max-width: 90%;
    margin: auto;
    background: #1f2937;
    padding: 30px;
    border-radius: 12px;
    box-sizing: border-box;
}

h1 {
    color: #f4c542;
}

#status {
    margin-top: 25px;
    font-size: 18px;
    line-height: 1.6;
    word-wrap: break-word;
}

button {
    margin-top: 30px;
    padding: 12px 25px;
    background: #f4c542;
    color: #111827;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: gold;
}

pre {
    text-align: left;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

    <h1>WeOneFX</h1>

    <h2>Payment Verification</h2>

    <p id="status">
        🔄 Verifying your payment...
    </p>

    <button
        id="dashboardButton"
        type="button">
        Return to Dashboard
    </button>

</div>

<!-- External JavaScript only -->
<script src="payment-success.js"></script>

</html>
