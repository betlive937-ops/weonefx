<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Payment Verification - WeOneFX</title>

<style>

body {
    margin: 0;
    min-height: 100vh;
    background: #111827;
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
    box-sizing: border-box;
}

.container {
    width: 500px;
    max-width: 100%;

    background: #1f2937;

    padding: 40px 30px;

    border-radius: 16px;

    box-sizing: border-box;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.35);
}

.logo {
    color: #f4c542;

    font-size: 32px;

    font-weight: bold;

    margin-bottom: 10px;
}

h2 {
    margin-top: 10px;

    font-size: 24px;
}

#status {
    margin-top: 30px;

    font-size: 18px;

    line-height: 1.6;

    min-height: 80px;
}

.status-icon {
    font-size: 42px;

    display: block;

    margin-bottom: 15px;
}

button {
    margin-top: 30px;

    padding: 13px 28px;

    background: #f4c542;

    color: #111827;

    border: none;

    border-radius: 8px;

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;
}

button:hover {
    background: gold;
}

button:disabled {
    opacity: 0.6;

    cursor: not-allowed;
}

.small {
    margin-top: 20px;

    color: #9ca3af;

    font-size: 13px;
}

</style>

</head>


<body>

<div class="container">

    <div class="logo">
        WeOneFX
    </div>

    <h2>
        Payment Verification
    </h2>

    <p id="status">

        <span class="status-icon">🔄</span>

        Verifying your payment...

    </p>

    <button id="dashboardButton">

        Return to Dashboard

    </button>

    <div class="small">

        Please do not close this page while your payment is being verified.

    </div>

</div>


<!-- IMPORTANT:
     JavaScript is loaded from an external file.
     This is compatible with script-src 'self'.
-->

<script
    src="/payment-success.js?v=2"
    defer>
</script>


</body>

</html>
